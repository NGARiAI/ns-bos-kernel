title = "NS BOS Kernel Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Known-safe patterns for the NS BOS Kernel"
paths = [
    ".git/",
    "__pycache__/",
    "node_modules/",
    "sbom/",
]

[[rules]]
id = "ngari-hardcoded-path"
description = "Hardcoded /home/garry user path"
regex = '''/home/garry/'''
tags = ["ngari", "pii"]

[[rules]]
id = "ngari-finix-test-card"
description = "Finix test credit card number"
regex = '''4111111111111111|4242424242424242'''
tags = ["ngari", "finix", "test-card"]

[[rules]]
id = "ngari-internal-ip"
description = "Internal IP address exposure"
regex = '''192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|100\.\d{1,3}\.\d{1,3}\.\d{1,3}'''
tags = ["ngari", "infrastructure"]
