# Build backend declaration ONLY.
#
# Package metadata deliberately stays in core/kernel/setup.py — the repository's single
# source of truth, per the root setup.py shim which delegates there. Repeating the name,
# version or dependencies here would create a second source of truth that can drift,
# which is the failure mode this repo already warns about elsewhere.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
